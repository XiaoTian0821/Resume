<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portfolio</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-wrapper">
        <!-- Animated Background Shapes -->
        <div class="bg-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
            <div class="shape shape-4"></div>
            <div class="shape shape-5"></div>
        </div>

        <div class="container">
            <div class="row justify-content-center align-items-center min-vh-100">
                <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
                    <!-- Login Card -->
                    <div class="login-card">
                        <!-- Logo / Brand -->
                        <div class="login-brand text-center mb-4">
                            <div class="brand-icon">
                                <i class="fas fa-code"></i>
                            </div>
                            <h2 class="brand-title">Portfolio</h2>
                            <p class="brand-subtitle">Sign in to continue</p>
                        </div>

                        <!-- Error Message -->
                        <div id="loginError" class="alert alert-danger d-none" role="alert">
                            <i class="fas fa-exclamation-circle me-2"></i>
                            <span id="errorText">Invalid credentials. Please try again.</span>
                        </div>

                        <!-- Success Message -->
                        <div id="loginSuccess" class="alert alert-success d-none" role="alert">
                            <i class="fas fa-check-circle me-2"></i>
                            Login successful! Redirecting...
                        </div>

                        <!-- Login Form -->
                        <form id="loginForm" novalidate>
                            <!-- Username Field -->
                            <div class="mb-4">
                                <label for="username" class="form-label">
                                    <i class="fas fa-user me-2"></i>Username
                                </label>
                                <input
                                    type="text"
                                    class="form-control form-control-lg"
                                    id="username"
                                    placeholder="Enter your username"
                                    autocomplete="username"
                                    required
                                >
                                <div class="invalid-feedback">Please enter your username.</div>
                            </div>

                            <!-- Password Field -->
                            <div class="mb-4">
                                <label for="password" class="form-label">
                                    <i class="fas fa-lock me-2"></i>Password
                                </label>
                                <div class="input-group input-group-lg">
                                    <input
                                        type="password"
                                        class="form-control"
                                        id="password"
                                        placeholder="Enter your password"
                                        autocomplete="current-password"
                                        required
                                    >
                                    <button
                                        class="btn btn-outline-secondary"
                                        type="button"
                                        id="togglePassword"
                                        aria-label="Toggle password visibility"
                                        title="Show/Hide Password"
                                    >
                                        <i class="fas fa-eye" id="toggleIcon"></i>
                                    </button>
                                </div>
                                <div class="invalid-feedback">Please enter your password.</div>
                            </div>

                            <!-- Remember Me & Forgot -->
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="form-check">
                                    <input
                                        class="form-check-input"
                                        type="checkbox"
                                        id="rememberMe"
                                    >
                                    <label class="form-check-label" for="rememberMe">
                                        Remember Me
                                    </label>
                                </div>
                                <a href="#" class="forgot-link" onclick="showForgotHint(event)">
                                    Forgot Password?
                                </a>
                            </div>

                            <!-- Login Button -->
                            <button
                                type="submit"
                                class="btn btn-login w-100 btn-lg mb-3"
                                id="loginBtn"
                            >
                                <i class="fas fa-sign-in-alt me-2"></i>Sign In
                            </button>
                        </form>
                    </div>

                    <!-- Footer Text -->
                    <p class="text-center text-white-50 mt-4 small">
                        &copy; <span id="footerYear"></span> All Rights Reserved.
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="js/login.js"></script>
</body>
</html>
